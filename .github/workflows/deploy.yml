name: Deploy test site

# Every push to main uploads the static site to Cloudflare Pages
# (same account and setup as Dispatcher). Needs the repo secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create the Pages project (first run only)
        run: |
          npx --yes wrangler@3 pages project list | grep -q " pimentel-preview " \
            || npx --yes wrangler@3 pages project create pimentel-preview --production-branch main || true
      - name: Upload site
        run: |
          mkdir -p dist && cp index.html styles.css logo-mark.svg dist/
          npx --yes wrangler@3 pages deploy dist --project-name pimentel-preview --branch main
